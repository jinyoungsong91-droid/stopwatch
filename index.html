<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Classic Stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:wght@500&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background:
      radial-gradient(ellipse at 50% 15%, #2a2118 0%, #0e0b07 65%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 2px);
    font-family: 'EB Garamond', serif;
    overflow: hidden;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; color: #e9dfc8;
  }

  /* ---- quote ---- */
  .quote-box {
    max-width: 560px;
    min-height: 76px;
    text-align: center;
    padding: 0 20px;
    margin-bottom: 26px;
  }
  .ornament { color: #9a7b3f; font-size: 0.9rem; letter-spacing: 6px; margin-bottom: 6px; opacity: 0.8; }
  .quote-en {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.3rem;
    color: #d9c79a;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  .quote-kr {
    font-family: 'Gowun Batang', serif;
    font-size: 0.95rem;
    letter-spacing: 0.2px;
    color: #a08f68;
    margin-top: 6px;
    opacity: 0;
    transition: opacity 0.9s ease 0.1s;
  }
  .quote-box.show .quote-en, .quote-box.show .quote-kr { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .quote-en, .quote-kr, .buttons button { transition: none; }
  }

  /* ---- pocket watch ---- */
  .watch {
    position: relative;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f2d78c, #b8933f 45%, #7a5a24 78%, #4a3413 100%);
    box-shadow:
      0 25px 60px rgba(0,0,0,0.6),
      inset 0 0 0 3px rgba(255,240,200,0.35),
      inset 0 0 20px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
  }
  .watch::before {
    content: '';
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 26px;
    background: linear-gradient(180deg,#d9b569,#7a5a24);
    border-radius: 4px;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
  }
  .dial {
    width: 288px; height: 288px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fffaef, #ece0c2 65%, #cbb888 100%);
    box-shadow:
      inset 0 8px 18px rgba(0,0,0,0.35),
      inset 0 -6px 14px rgba(255,255,255,0.5),
      inset 0 0 0 2px rgba(120,90,30,0.45);
    position: relative;
    overflow: hidden;
  }
  .dial::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    background: linear-gradient(160deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.08) 30%, transparent 55%);
    pointer-events: none;
  }
  .dial::after {
    content: '';
    position: absolute; left: 8%; top: 4%;
    width: 55%; height: 30%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 40% 30%, rgba(255,255,255,0.65), transparent 70%);
    filter: blur(2px);
    pointer-events: none;
  }
  .tick {
    position: absolute; left: 50%; top: 50%;
    width: 2px; height: 10px;
    margin: -5px 0 0 -1px;
    background: #8a6a34;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6);
    transform-origin: center;
  }
  .tick.major { height: 16px; width: 3px; margin: -8px 0 0 -1.5px; background: #4a3413; }
  .numeral {
    position: absolute;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: #5c421c;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    transform: translate(-50%, -50%);
  }
  .time {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 2.15rem;
    letter-spacing: 1px;
    color: #3a2a11;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6), 0 2px 4px rgba(0,0,0,0.15);
    z-index: 2;
  }

  /* ---- controls ---- */
  .buttons { margin-top: 34px; display: flex; gap: 14px; }
  .buttons button {
    font-family: 'Gowun Dodum', 'EB Garamond', sans-serif;
    font-size: 0.92rem;
    letter-spacing: 1px;
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    color: #f3e6c4;
    background: linear-gradient(180deg, #8a6a2e, #4a3413);
    border: 1px solid rgba(255,230,180,0.35);
    box-shadow:
      0 6px 0 rgba(0,0,0,0.35),
      0 10px 16px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -3px 6px rgba(0,0,0,0.3);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s;
  }
  .buttons button:hover { filter: brightness(1.15); }
  .buttons button:focus-visible { outline: 2px solid #e0b65c; outline-offset: 3px; }
  .buttons button:active {
    transform: translateY(4px);
    box-shadow:
      0 2px 0 rgba(0,0,0,0.35),
      0 3px 6px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.25),
      inset 0 -2px 4px rgba(0,0,0,0.3);
  }
  #startBtn {
    background: linear-gradient(180deg,#e0b65c,#8a6524);
    color: #241a08;
    box-shadow:
      0 6px 0 rgba(90,65,15,0.6),
      0 10px 18px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.6),
      inset 0 -3px 6px rgba(0,0,0,0.2);
  }
  button:disabled { opacity: 0.35; cursor: not-allowed; filter: none; }

  .laps {
    margin-top: 18px;
    max-height: 100px;
    overflow-y: auto;
    text-align: center;
    color: #a3906a;
    font-size: 0.85rem;
    list-style: none;
    padding: 0;
  }
  .laps li { margin: 2px 0; }
  .laps::-webkit-scrollbar { width: 5px; }
  .laps::-webkit-scrollbar-thumb { background: #5c421c; border-radius: 3px; }
</style>
</head>
<body>
  <div class="quote-box" id="quoteBox">
    <div class="ornament">❧</div>
    <div class="quote-en" id="quoteEn"></div>
    <div class="quote-kr" id="quoteKr"></div>
  </div>

  <div class="watch">
    <div class="dial" id="dial">
      <div class="time" id="display" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">00:00:00.00</div>
    </div>
  </div>

  <div class="buttons">
    <button id="startBtn">시작</button>
    <button id="pauseBtn" disabled>정지</button>
    <button id="lapBtn" disabled>랩</button>
    <button id="resetBtn">초기화</button>
  </div>
  <ol class="laps" id="lapList"></ol>

<script>
  // ---- 다이얼 눈금 생성 ----
  const dial = document.getElementById('dial');
  const numerals = ['XII','III','VI','IX'];
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    tick.style.transform = `rotate(${i * 6}deg) translateY(-134px)`;
    dial.appendChild(tick);
  }
  const radius = 118;
  [0,90,180,270].forEach((deg, idx) => {
    const num = document.createElement('div');
    num.className = 'numeral';
    num.textContent = numerals[idx];
    const rad = (deg - 90) * Math.PI / 180;
    num.style.left = `${144 + radius * Math.cos(rad)}px`;
    num.style.top = `${144 + radius * Math.sin(rad)}px`;
    dial.appendChild(num);
  });

  // ---- 명언 롤링 ----
  const QUOTES = [
    ["The future depends on what you do today.", "미래는 오늘 당신이 무엇을 하느냐에 달려 있다."],
    ["Discipline is the bridge between goals and accomplishment.", "목표와 성취를 잇는 다리는 바로 규율이다."],
    ["Success is the sum of small efforts repeated daily.", "성공은 매일 반복된 작은 노력의 합이다."],
    ["Your career is a marathon, not a sprint.", "커리어는 단거리가 아니라 마라톤이다."],
    ["Focus on being productive instead of busy.", "바쁜 것이 아니라 생산적인 것에 집중하라."],
    ["The only way to do great work is to love what you do.", "위대한 일을 하는 유일한 방법은 그 일을 사랑하는 것이다."],
    ["Time is the most valuable thing a person can spend.", "시간은 사람이 쓸 수 있는 가장 소중한 자원이다."],
    ["Small daily improvements lead to staggering results.", "매일의 작은 개선이 놀라운 결과를 만든다."],
    ["Don't watch the clock; do what it does. Keep going.", "시계를 보지 말고, 시계처럼 하라. 계속 가라."],
    ["Growth begins at the edge of your comfort zone.", "성장은 편안함의 끝에서 시작된다."]
  ];
  const quoteBox = document.getElementById('quoteBox');
  const quoteEn = document.getElementById('quoteEn');
  const quoteKr = document.getElementById('quoteKr');
  let qIndex = -1;
  function showNextQuote() {
    quoteBox.classList.remove('show');
    setTimeout(() => {
      qIndex = (qIndex + 1) % QUOTES.length;
      quoteEn.textContent = QUOTES[qIndex][0];
      quoteKr.textContent = QUOTES[qIndex][1];
      quoteBox.classList.add('show');
    }, 400);
  }
  showNextQuote();
  setInterval(showNextQuote, 6000);

  // ---- 스톱워치 ----
  let startTime = 0, elapsed = 0, timerId = null;
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapList = document.getElementById('lapList');

  function format(ms) {
    const totalCentis = Math.floor(ms / 10);
    const centis = totalCentis % 100;
    const totalSeconds = Math.floor(totalCentis / 100);
    const seconds = totalSeconds % 60;
    const totalMinutes = Math.floor(totalSeconds / 60);
    const minutes = totalMinutes % 60;
    const hours = Math.floor(totalMinutes / 60);
    const pad = (n, l = 2) => String(n).padStart(l, '0');
    return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}.${pad(centis)}`;
  }
  function tick() {
    display.textContent = format(Date.now() - startTime + elapsed);
    timerId = requestAnimationFrame(tick);
  }
  function start() {
    startTime = Date.now();
    tick();
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    lapBtn.disabled = false;
  }
  function pause() {
    elapsed += Date.now() - startTime;
    cancelAnimationFrame(timerId);
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    lapBtn.disabled = true;
    startBtn.textContent = '재개';
  }
  function reset() {
    cancelAnimationFrame(timerId);
    elapsed = 0;
    display.textContent = format(0);
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    lapBtn.disabled = true;
    startBtn.textContent = '시작';
    lapList.innerHTML = '';
  }
  function addLap() {
    const li = document.createElement('li');
    li.textContent = display.textContent;
    lapList.insertBefore(li, lapList.firstChild);
  }
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', reset);
  lapBtn.addEventListener('click', addLap);
</script>
</body>
</html>
